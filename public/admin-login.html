<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Rahul Travel - Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(
                135deg,
                #0d6efd,
                #0b5ed7
            );
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            padding: 32px;
            border-radius: 16px;
            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.20);
        }

        .logo {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            color: #0d6efd;
            margin-bottom: 6px;
        }

        .subtitle {
            text-align: center;
            color: #6c757d;
            font-size: 14px;
            margin-bottom: 28px;
        }

        .login-box label {
            display: block;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 7px;
            color: #212529;
        }

        .login-box input {
            width: 100%;
            min-height: 46px;
            padding: 11px 13px;
            border: 1px solid #ced4da;
            border-radius: 9px;
            font-size: 14px;
            margin-bottom: 18px;
            outline: none;
        }

        .login-box input:focus {
            border-color: #0d6efd;
            box-shadow:
                0 0 0 3px rgba(13, 110, 253, 0.10);
        }

        .login-btn {
            width: 100%;
            min-height: 46px;
            border: 0;
            border-radius: 9px;
            background: #0d6efd;
            color: white;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #0b5ed7;
        }

        .login-btn:active {
            transform: scale(0.98);
        }

        .error-message {
            display: none;
            margin-top: 15px;
            padding: 10px;
            border-radius: 8px;
            background: #f8d7da;
            color: #842029;
            font-size: 13px;
            text-align: center;
        }

        .footer-text {
            text-align: center;
            margin-top: 22px;
            font-size: 12px;
            color: #6c757d;
        }

        @media (max-width: 480px) {

            .login-box {
                padding: 25px 20px;
            }

            .logo {
                font-size: 26px;
            }

        }

    </style>

</head>

<body>

    <div class="login-box">

        <div class="logo">
            ✈️ Rahul Travel
        </div>

        <div class="subtitle">
            Admin Dashboard Login
        </div>

        <form id="loginForm">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Enter admin username"
                autocomplete="username"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter admin password"
                autocomplete="current-password"
                required
            >

            <button
                type="submit"
                class="login-btn"
            >
                🔐 Login
            </button>

        </form>

        <div
            id="errorMessage"
            class="error-message"
        >
            Invalid username or password.
        </div>

        <div class="footer-text">
            Rahul Travel • Admin Area
        </div>

    </div>
<script>

    document.getElementById("loginForm").addEventListener("submit", async function(event) {

        event.preventDefault();

        const username =
            document.getElementById("username").value.trim();

        const password =
            document.getElementById("password").value;

        const errorMessage =
            document.getElementById("errorMessage");

        const loginButton =
            document.querySelector(".login-btn");

        errorMessage.style.display = "none";

        loginButton.disabled = true;
        loginButton.textContent = "🔐 Logging in...";

        try {

            const response = await fetch("/api/admin/login", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    username: username,
                    password: password
                })
            });

            const result = await response.json();

            if (!result.success) {
                throw new Error(
                    result.message || "Login failed."
                );
            }

            console.log("ADMIN LOGIN SUCCESS ✅");

            window.location.href = "/admin.html";

        } catch (error) {

            console.error("ADMIN LOGIN ERROR:", error);

            errorMessage.textContent =
                error.message || "Invalid username or password.";

            errorMessage.style.display = "block";

        } finally {

            loginButton.disabled = false;
            loginButton.textContent = "🔐 Login";

        }

    });

</script>
</body>

</html>
